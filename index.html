<style>
/* VOICE: episch, golden, Strategiespiel
   IDEA: Spielmenü auf Pergament-Gold-Rahmen über den Splash-Bildern
   PICTURE: die beiden Bilder des Spielers füllen den Schirm
   COLOUR and TYPE: Weltraumblau, Gold #e8b64a, Cinzel + Barlow
   LAYOUT: Ladebalken exakt im Bildbalken; Menü rechts (quer) bzw. unten (hoch) */
:root{--gold:#e8b64a;--gold2:#fff0b8;--dark:#0a0f22;--ink:#fff7e2}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#050814;color:var(--ink);overflow:hidden;
  font:16px/1.4 "Barlow Semi Condensed",system-ui,sans-serif;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.screen{position:fixed;inset:0;transition:opacity .7s}
.hidden{opacity:0;pointer-events:none}

/* ---------- Ladebildschirm ---------- */
#load .blur{position:absolute;inset:-40px;background:url(laden.jpg?v=2) center/cover;filter:blur(22px) brightness(.55)}
#load .stage{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(100vw,177.68vh);aspect-ratio:1672/941;background:url(laden.jpg?v=2) center/100% 100%;box-shadow:0 0 60px #000}
.bar{position:absolute;left:9.7%;width:80.6%;top:87.5%;height:4.6%;border-radius:3px;overflow:hidden}
.fill{position:absolute;inset:0;width:0%;background:linear-gradient(180deg,#fff3b0,#e8b64a 45%,#9a6414);
  box-shadow:0 0 18px #ffc95a;transition:width .25s}
.fill::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,#ffffff80,transparent);
  width:30%;animation:shine 1.4s linear infinite}
@keyframes shine{from{transform:translateX(-100%)}to{transform:translateX(400%)}}
.btxt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:.6em;
  font:700 clamp(9px,1.9vh,15px) "Cinzel",Georgia,serif;letter-spacing:.06em;color:#fff;text-shadow:0 1px 3px #000,0 0 6px #000}
.tip{position:absolute;left:10%;right:10%;top:93.2%;text-align:center;font-size:clamp(9px,2.2vh,15px);color:#ffe9b0;
  text-shadow:0 1px 3px #000}
.tap .btxt{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}

/* ---------- Hauptmenü ---------- */
#menu .bg{position:absolute;inset:0;background:url(menue.jpg?v=2) 18% top/cover;transform-origin:20% 0;animation:pan 30s ease-in-out infinite alternate}
@keyframes pan{to{transform:scale(1.05)}}
#menu .shade{position:absolute;inset:0;background:linear-gradient(90deg,transparent 45%,#0a0f22c0 80%);-webkit-mask-image:linear-gradient(180deg,transparent 24%,#000 36%);mask-image:linear-gradient(180deg,transparent 24%,#000 36%)}
.panel{position:absolute;right:max(4vw,env(safe-area-inset-right));top:50%;transform:translateY(-50%);
  width:min(330px,40vw);display:flex;flex-direction:column;gap:clamp(6px,1.6vh,12px)}
.btn{position:relative;display:block;width:100%;padding:clamp(8px,2.2vh,14px) 18px;border:2px solid var(--gold);border-radius:10px;
  background:linear-gradient(180deg,#1d2752ee,#0b1130ee);color:var(--gold2);cursor:pointer;
  font:800 clamp(14px,3.6vh,21px) "Cinzel",Georgia,serif;letter-spacing:.05em;text-align:center;
  box-shadow:0 4px 0 #6d4a10,0 6px 16px #0009,inset 0 1px 0 #ffffff30;text-shadow:0 2px 2px #000;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #6d4a10,0 3px 8px #0009}
.btn.main{background:linear-gradient(180deg,#f6cf62,#c98a1e);color:#3a2203;text-shadow:0 1px 0 #ffe9a0;border-color:#fff0b8}
.btn.small{font-size:clamp(12px,2.8vh,16px);padding:8px 12px}
.btn.dis,.btn:disabled{opacity:.4;filter:grayscale(1);pointer-events:none}
#updBar{position:fixed;left:50%;bottom:calc(6px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:3px;min-width:190px;padding:5px 10px 6px;border-radius:10px;background:#0b1130e8;border:1px solid #e8b64a90;box-shadow:0 3px 10px #0008;font:600 11px system-ui,sans-serif;color:#ffe9b0;cursor:pointer;transition:opacity .4s}
#updBar.hidden{display:none}#updBar.mini{opacity:.55;transform:translateX(-50%) scale(.85)}
#updBar .ub{height:4px;border-radius:2px;background:#0008;overflow:hidden}#updFill{height:100%;width:0;background:linear-gradient(90deg,#7ee87a,#3fbf5a);transition:width .2s}
#updBar.tap{border-color:#7ee87a}
.ver{position:absolute;left:max(12px,env(safe-area-inset-left));bottom:8px;font-size:12px;color:#fff9;text-shadow:0 1px 2px #000}
.ico.quit{color:#ff8a8a}
.corner{position:absolute;top:max(8px,env(safe-area-inset-top));right:max(8px,env(safe-area-inset-right));display:flex;gap:2px;z-index:5}
.corner2{position:absolute;left:max(10px,env(safe-area-inset-left));bottom:28px;z-index:5}
#menu .corner2 .ico{width:40px;height:40px}
#menu .corner2 .ico svg{width:20px;height:20px}
#menu .corner .ico{width:40px;height:40px}
#menu .corner .ico svg{width:20px;height:20px}
.ico{width:44px;height:44px;border-radius:50%;border:2px solid var(--gold);background:#0b1130cc;color:var(--gold2);
  display:grid;place-items:center;cursor:pointer}
.ico svg{width:22px;height:22px}

/* Dialoge */
.dlg{position:absolute;inset:0;display:grid;place-items:center;background:#02040cb0;backdrop-filter:blur(3px);transition:opacity .25s}
.card{width:min(560px,92vw);max-height:88vh;overflow:auto;padding:clamp(12px,3vh,22px) 20px;border:2px solid var(--gold);border-radius:14px;
  background:linear-gradient(180deg,#18224a,#0a0f26);box-shadow:0 10px 40px #000}
.card h2{margin:0 0 10px;font:800 clamp(18px,4.4vh,26px) "Cinzel",Georgia,serif;color:var(--gold);text-align:center}
.row{display:grid;grid-template-columns:8.5em minmax(0,1fr);align-items:center;gap:10px;margin:8px 0}
.row label{color:#ffe9b0}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{flex:1 1 auto;min-height:38px;padding:4px 8px;border:1.5px solid #e8b64a80;border-radius:8px;background:#0b1130;color:#fff7e2;
  font:600 14px "Barlow Semi Condensed",sans-serif;cursor:pointer}
.seg button.on{background:var(--gold);color:#2b1a02;border-color:var(--gold2)}
input[type=range]{width:100%;accent-color:var(--gold);height:30px}

.step{display:flex;align-items:center;gap:6px}
.step button{min-width:40px;min-height:36px;border:1.5px solid #e8b64a80;border-radius:8px;background:#0b1130;color:#fff7e2;font:700 18px "Barlow Semi Condensed",sans-serif;cursor:pointer}
.step button.all{font-size:14px;padding:0 10px}.step button.on{background:var(--gold);color:#2b1a02}
.step b{min-width:74px;text-align:center;font:700 17px "Barlow Semi Condensed",sans-serif;color:var(--gold2)}
.snd{position:absolute;left:1.2%;bottom:1.2%;font:700 clamp(9px,1.8vh,13px) "Barlow Semi Condensed",sans-serif;color:#ffe9b0;text-shadow:0 1px 3px #000;animation:pulse 1.4s ease-in-out infinite}
.ver2{position:absolute;right:1.2%;bottom:1.2%;font:700 clamp(9px,1.8vh,13px) "Barlow Semi Condensed",sans-serif;color:#ffe9b0;text-shadow:0 1px 3px #000}
.card.wide{width:min(860px,96vw)}
.cols{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.nats{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px}
@media (orientation:landscape){.nats{grid-template-columns:repeat(10,minmax(0,1fr));gap:3px}}
@media (orientation:landscape) and (min-width:560px){#dPlay .cols{grid-template-columns:minmax(0,1fr);gap:4px}#dPlay .cols>div:last-child{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);column-gap:18px}#dPlay .row{margin:2px 0}#dPlay .acts{grid-column:1/-1;margin-top:6px;justify-content:center}#dPlay .acts .btn{max-width:260px}#dPlay .bonus{min-height:0;margin-top:3px;font-size:13px}#dPlay .nat{min-height:0;padding:2px 1px}#dPlay .nat svg{width:22px;height:26px}#dPlay h2{display:none}#dPlay .nat svg{width:29px;height:34px}#dPlay .card{max-height:96vh}#dPlay .nat{gap:0;padding:1px}#dPlay .nat span{line-height:1.15}#dPlay .nat em{line-height:1.1}#dPlay .nats{gap:3px}#dPlay .seg button,#dPlay .epbtn,#dPlay .step button{min-height:30px}#dPlay .acts .btn{padding-top:6px;padding-bottom:6px}#dPlay .nat span{font-size:10.5px}#dPlay .nat em{font-size:9.5px}#dPlay .seg button{min-height:32px}}
.btn.off{filter:grayscale(.8);opacity:.6}
.card,.pcard,#dip .dcard{position:relative}
.winx,#dOnline .on-x,#scId .sc-zu,#dip .dx{position:absolute!important;top:8px;right:8px;left:auto;margin:0;width:32px;height:32px;padding:0;border-radius:50%!important;border:2px solid #f5d27a!important;background:#8a1c14!important;color:#fff!important;font:700 15px/1 sans-serif!important;cursor:pointer;box-shadow:0 2px 6px #000a;z-index:5}
.card h2,.pcard h2{padding-right:36px}
.seg[data-k=gfx] button{display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05}.seg[data-k=gfx] button small{font-size:10px;font-weight:400;opacity:.8}
.cpath{display:inline-flex;align-items:center;justify-content:center;gap:5px;flex-wrap:wrap;line-height:18px}.cpath i{font-style:normal;color:#e8b64a}#bonus{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;column-gap:10px}.cbon{font-size:12.5px}.cpath .pi{display:inline-flex;align-items:center;gap:3px;opacity:.55;color:#e9dcb8;font-size:12.5px}.cpath .pi.on{opacity:1;color:#f5c542;font-weight:700}.cpath .pi svg{width:15px;height:18px}.cpath .pi:last-child svg{width:18px;height:12px;border:1px solid #fff7e299}
.nat{position:relative;overflow:hidden}.nat svg.nflag{position:absolute;top:0;left:0;transform:none;width:21px!important;height:21px!important;margin:0;border:0;border-radius:0;clip-path:none;filter:drop-shadow(1px 1px 1.5px #000a);box-shadow:none;flex:none}
@media (orientation:portrait){#dPlay .row{grid-template-columns:5.4em minmax(0,1fr);margin:6px 0;font-size:14px}#dPlay .seg button{min-height:34px;padding:3px 2px;font-size:13px}#dPlay h2{margin-bottom:6px}#dPlay .nat span{font-size:10px}#dPlay .nat em{font-size:9px}}
.bonus small{display:block;font-size:12px;color:#d9c79a;opacity:.85;margin-top:2px}
.nat{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 1px;min-height:44px;border:1.5px solid #e8b64a50;border-radius:9px;background:#0b1130;color:#fff7e2;cursor:pointer;font:700 13px "Barlow Semi Condensed",sans-serif}
.nat svg{width:26px;height:31px;filter:drop-shadow(0 1px 2px #000a)}
.nat span{font-size:11px;line-height:1.05;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;color:#fff7e2}
.nat em{font-style:normal;font-size:9.5px;line-height:1.05;color:#cbb88a;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.eprow{position:relative;display:flex;align-items:center;gap:6px}.epbis{color:#ffe9b0;font-weight:400;font-size:13px}.eppop.right{left:auto;right:0}.epbtn{min-height:34px;padding:4px 14px;border:1.5px solid var(--gold2);border-radius:8px;background:var(--gold);color:#2b1a02;font:700 14px "Barlow Semi Condensed",sans-serif;cursor:pointer}.epbtn span{font-size:11px;margin-left:4px}
.eppop{position:absolute;left:0;bottom:calc(100% + 6px);z-index:5;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;width:min(520px,86vw);padding:8px;border:2px solid var(--gold);border-radius:12px;background:#0b1130;box-shadow:0 8px 24px #000c}.eppop.hidden{display:none}
.eppop button{display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 2px;border:1.5px solid #e8b64a80;border-radius:8px;background:#0b1130;color:#fff7e2;font:600 12px "Barlow Semi Condensed",sans-serif;line-height:1.1;cursor:pointer}.eppop button b{font-size:10px;color:#e8b64a}.eppop button.on{background:var(--gold);color:#2b1a02}.eppop button.on b{color:#2b1a02}.eppop button.off{opacity:.42;filter:grayscale(1)}.eppop button small{font-size:9px;font-weight:400}
.nat.on{border-color:var(--gold2);background:#3a2a08;box-shadow:0 0 0 2px var(--gold) inset}
.bonus{margin-top:6px;min-height:2.6em;font-size:14px;color:#ffe9b0;text-align:center}
.bonus b{color:var(--gold)}
@media (orientation:landscape) and (min-width:560px){.cols{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)}
 .card.wide .row{grid-template-columns:6.6em minmax(0,1fr);margin:6px 0}.seg button{min-height:34px}.card.wide .seg{flex-wrap:nowrap}.card.wide .seg button{padding:4px 3px;font-size:13.5px}}
@media (max-width:480px){.nat span{font-size:9.5px}.nats{gap:3px}}
@media (max-height:430px){.card.wide{padding:10px 14px}.card.wide h2{margin-bottom:6px;font-size:19px}.nat{padding:3px 1px}.nat svg{width:20px;height:24px}.acts{margin-top:8px}}
.toast{position:absolute;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);padding:10px 18px;border-radius:10px;
  background:#0b1130ee;border:1.5px solid var(--gold);color:var(--gold2);font-weight:700;transition:opacity .3s;white-space:nowrap}


/* ---------- Spiel ---------- */
#game{background:#000;touch-action:none}
#gc{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#sel-box{position:absolute;display:none;border:2px solid #ffe38a;background:#ffe38a22;pointer-events:none;border-radius:4px}
#topbar{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:clamp(4px,1.2vw,12px);
  padding:max(6px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) 6px max(10px,env(safe-area-inset-left));
  background:linear-gradient(180deg,#0a0f22e6,#0a0f2200);pointer-events:none}
.rs{display:flex;align-items:center;gap:4px;padding:3px 9px 3px 5px;border-radius:20px;background:#0b1130d9;border:1.5px solid #e8b64a70;
  font:700 15px "Barlow Semi Condensed",sans-serif;color:#fff7e2;min-width:62px}
.rs svg{width:20px;height:20px}.rs .rv{display:flex;flex-direction:column;line-height:1.05}.rs .rv small{font:600 9px system-ui,sans-serif;color:#e8dcc0;opacity:.85;letter-spacing:.02em}

.age{margin-left:auto;font:700 14px "Cinzel",Georgia,serif;color:var(--gold2);text-shadow:0 1px 2px #000;white-space:nowrap}

.age{display:flex;flex-direction:column;align-items:flex-end;line-height:1.15}

@keyframes delPulse{from{box-shadow:0 0 0 #ff5a4a00}to{box-shadow:0 0 12px #ff5a4a}}
.hb{pointer-events:auto;width:44px;height:44px;border-radius:12px;border:2px solid var(--gold);background:#0b1130e0;color:var(--gold2);display:grid;place-items:center;cursor:pointer;position:relative}

#bigmap{position:fixed;inset:0;z-index:60;background:rgba(3,8,16,.7);display:flex;align-items:center;justify-content:center;padding:14px max(14px,env(safe-area-inset-right)) 14px max(14px,env(safe-area-inset-left))}#bigmap.hidden{display:none}

#game.ep1 #dip .dtab{border:1.5px solid #9c8462;background:linear-gradient(rgba(28,22,16,.35),rgba(10,8,6,.7)),var(--ep-in) center/cover;color:#f0d9a8;text-shadow:0 1px 2px #000;box-shadow:inset 0 1px 0 #ffffff22,0 2px 5px #0008}
#game.ep1 #dip .dtab.on{background:linear-gradient(#e9c98e,#b8894a);color:#2a1a08;text-shadow:none;border-color:#f3e2c2;box-shadow:0 0 10px #e8b64a66}
#game.ep1 #dip .dnote{color:#e8d3a8;font-style:italic;text-shadow:0 1px 2px #000}
#game.ep1 #dip .drow{position:relative;background:linear-gradient(90deg,rgba(18,14,10,.55),rgba(10,8,6,.78)),var(--ep-in) center/cover;border:1.5px solid #6e5a40;box-shadow:inset 0 1px 0 #ffffff14,0 2px 6px #0009}
#game.ep1 #dip .drow.st-ally{border-color:#5fbf6a;box-shadow:inset 3px 0 0 #5fbf6a,0 0 10px #5fbf6a33}
#game.ep1 #dip .drow.st-enemy{border-color:#8a3a2e;box-shadow:inset 3px 0 0 #c8463a,0 2px 6px #0009}
#game.ep1 #dip .dn b{color:#f3e2c2;text-shadow:0 1px 2px #000}
#game.ep1 #dip .dst{background:#0007;border-radius:9px;padding:2px;box-shadow:inset 0 1px 3px #000c}
#game.ep1 #dip .dst button{border:none;background:transparent;color:#cdb895;border-radius:7px}
#game.ep1 #dip .dst button.ally.on{background:linear-gradient(#5fbf6a,#2f7f3a);color:#fff;box-shadow:0 0 8px #5fbf6a88}
#game.ep1 #dip .dst button.neutral.on{background:linear-gradient(#d8b05a,#8f6a22);color:#fff;box-shadow:0 0 8px #e8b64a77}
#game.ep1 #dip .dst button.enemy.on{background:linear-gradient(#d0503f,#86231c);color:#fff;box-shadow:0 0 8px #ff5a4a77}
#game.ep1 #dip .mood{background:#000a;height:5px;box-shadow:inset 0 1px 2px #000}
#game.ep1 #dip .dx{border-color:#d9b98a}
#dip .drow>i,#dip .dciv i,#offer i{width:12px;height:30px;border-radius:3px;flex:none;display:inline-block}
#dip .dn{flex:1;min-width:0;display:flex;flex-direction:column}
#dip .dn b{font:800 14px "Cinzel",Georgia,serif;color:var(--gold2)}
#dip .dn small{font-size:11.5px;color:#cfd7ff}
#dip .mood{display:block;height:4px;border-radius:2px;background:#0006;margin-top:3px;max-width:150px;overflow:hidden}
#dip .mood s{display:block;height:100%;background:linear-gradient(90deg,#e23b3b,#f2c230,#3fbf5a)}
#dip .dst{display:flex;gap:3px}
#dip .dst button{padding:6px 8px;border-radius:8px;border:1.5px solid #ffffff30;background:#0b1130;color:#cfd7ff;font:700 12.5px sans-serif;cursor:pointer}
#dip .dst button.ally.on{background:#2f9e4a;border-color:#7dff9a;color:#fff}
#dip .dst button.neutral.on{background:#9a7a22;border-color:#ffe08a;color:#fff}
#dip .dst button.enemy.on{background:#a8262e;border-color:#ff8a8a;color:#fff}
#dip .dlab{font:700 12px sans-serif;color:var(--gold);margin:7px 0 3px;text-transform:uppercase;letter-spacing:.05em}
#dip .dline{display:flex;flex-wrap:wrap;gap:4px}
#dip .dciv,#dip .dres,#dip .damt{display:flex;align-items:center;gap:5px;padding:5px 9px;border-radius:8px;border:1.5px solid #ffffff30;background:#0b1130;color:var(--ink);font:700 13px sans-serif;cursor:pointer}
#dip .dciv i{height:14px;width:10px}
#dip .dres svg{width:18px;height:18px}
#dip .on.dciv,#dip .on.dres,#dip .on.damt{border-color:var(--gold);background:#3a2a08}
#dip .dciv.off{opacity:.45}
#dip .deal{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:10px;padding:8px;border-radius:10px;background:#ffffff10;font-size:14px}
#dip .deal b{color:var(--gold2)}
#dip .deal .btn{width:auto;margin-left:auto}
#dip .deal .btn + .btn{margin-left:0}
#dip .btn[disabled]{opacity:.4}
#offer{position:absolute;left:50%;top:62px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:#0b1130ee;border:2px solid var(--gold);z-index:3}
#offer.hidden{display:none}
#offer span{display:flex;align-items:center;gap:8px;color:var(--gold2);font-weight:700;font-size:14px}
#offer i{height:18px}
#placebar.hidden{display:none}
#fps{position:absolute;left:50%;top:6px;transform:translateX(-50%);padding:2px 8px;border-radius:8px;background:#000a;color:#7dff9a;font:700 13px monospace;z-index:3;pointer-events:none}
#fps.hidden{display:none}
#placebar span{color:#ffe9b0;font-weight:700;font-size:14px}
#pCost{display:flex;gap:8px}#pCost:empty{display:none}#pCost .c{display:flex;align-items:center;gap:2px;font-size:15px;color:#fff}#pCost .c svg{width:18px;height:18px}#pCost .c.miss{color:#ff5a5a}
.pb{width:54px;height:48px;border-radius:10px;font:800 24px sans-serif;cursor:pointer;border:2px solid #fff6}
.pb.ok{background:#2e9b47;color:#fff}.pb.gate{width:auto;padding:0 12px;font-size:16px;background:#3a2a08;color:#ffe9b0}.pb.gate.on{background:var(--gold);color:#2b1a02}.pb.hidden{display:none}.pb.no{background:#a8323a;color:#fff}.pb.dim{opacity:.4;background:#555!important;filter:grayscale(1)}
#pause{position:absolute;inset:0;display:grid;place-items:center;background:#02040cb8}
#pause.hidden{display:none}
.pcard{width:min(320px,86vw);display:flex;flex-direction:column;gap:12px;padding:18px;border:2px solid var(--gold);border-radius:14px;background:linear-gradient(180deg,#18224a,#0a0f26)}
.pcard h2{margin:0;text-align:center;font:800 24px "Cinzel",Georgia,serif;color:var(--gold)}
#rotate{display:none}
@media (orientation:portrait){#rotate{position:absolute;inset:0;display:grid;place-items:center;background:#0a0f22f2;z-index:5;
  font:800 20px "Cinzel",Georgia,serif;color:var(--gold2);text-align:center;padding:30px}}

@media (orientation:portrait){
  #menu::before{content:"";position:absolute;inset:-40px;background:url(menue.jpg?v=2) 30% center/cover;filter:blur(18px) brightness(.6)}
  #menu .bg{background:url(menue.jpg?v=2) center top/100% auto no-repeat;top:max(8vh,env(safe-area-inset-top));animation:none}
  #menu .shade{background:linear-gradient(180deg,transparent 40%,#0a0f22d0 75%)}
  .panel{left:6vw;right:6vw;width:auto;top:auto;bottom:calc(5vh + env(safe-area-inset-bottom));transform:none}
  .btn{font-size:clamp(15px,2.4vh,20px)}
  .row{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){#menu .bg,.fill::after{animation:none}}
</style>

<body>

<section id="load" class="screen">
  <div class="blur"></div>
  <div class="stage" id="stage">
    <div class="bar"><div class="fill" id="fill"></div><div class="btxt" id="btxt">Lade … 0 %</div></div>
    <div class="tip" id="tip"></div>
    <div class="ver2">Version 2.29</div>
    <div class="snd" id="soundHint">Tippe für Ton und Vollbild</div>
  </div>
</section>

<section id="game" class="screen hidden"></section>

<section id="menu" class="screen hidden">
  <div class="bg"></div><div class="shade"></div>
  <div class="panel">
    <button class="btn main hidden" id="bResume">Weiterspielen</button>
    <button class="btn main" data-open="dPlay">Spielen</button>
    <button class="btn" data-open="dSet">Einstellungen</button>
  </div>
  <div class="corner">
    <button class="ico" id="bFull" aria-label="Vollbild"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    <button class="ico quit" id="bQuit" aria-label="Spiel verlassen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <div class="corner2">
    <button class="ico" id="bSound" aria-label="Ton an/aus"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 9h4l5-4v14l-5-4H4z"/><path id="wave" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg></button>
  </div>
  <div class="ver">Siles Empire · V2.29</div>

  <div class="dlg hidden" id="dPlay"><div class="card wide"><button class="winx" data-close aria-label="Schließen">✕</button>
    <h2>Freies Spiel</h2>
    <div class="cols">
      <div><div class="nats" id="nats"></div><div class="bonus" id="bonus"></div></div>
      <div>
        <div class="row"><label>Epochen</label><div class="eprow"><button class="epbtn" id="epBtn">Steinzeit <span>▾</span></button><b class="epbis">bis</b><button class="epbtn" id="epEnd">Steinzeit <span>▾</span></button><div class="eppop hidden" id="epPop"></div></div></div>
        <div class="row"><label>Weltkarte</label><div class="seg" data-k="map"><button>Klein</button><button>Mittel</button><button>Groß</button><button>Riesig</button></div></div>
        <div class="row"><label>Gegner</label><div class="step"><button id="aiMinus" aria-label="weniger">−</button><b id="aiN">3</b><button id="aiPlus" aria-label="mehr">+</button><button id="aiAll" class="all">Max</button></div></div>
        <div class="row"><label>Schwierigkeit</label><div class="seg" data-k="diff"><button>Leicht</button><button>Mittel</button><button>Schwer</button></div></div>
        <div class="acts"><button class="btn small" data-close>Zurück</button><button class="btn main small" id="bStart">Schlacht starten</button></div>
      </div>
    </div>
  </div></div>

  <div class="dlg hidden" id="dSet"><div class="card"><button class="winx" data-close aria-label="Schließen">✕</button>
    <h2>Einstellungen</h2>
    <div class="row"><label>Grafik</label><div class="seg" data-k="gfx"><button>Niedrig</button><button>Mittel</button><button>Hoch</button><button>Ultra</button></div></div>
    <div class="row"><label>Musik</label><input type="range" min="0" max="100" data-k="music"></div>
    <div class="row"><label>Effekte</label><input type="range" min="0" max="100" data-k="sfx"></div>
    <div class="row"><label>Vibration</label><div class="seg" data-k="vib"><button>Aus</button><button>An</button></div></div>
    <div class="row"><label>FPS-Anzeige</label><div class="seg" data-k="fps"><button>Aus</button><button>An</button></div></div>
    <div class="acts"><button class="btn main small" data-close>Fertig</button></div>
  </div></div>

  <div class="toast hidden" id="toast"></div>
</section>

<div id="updBar" class="hidden"><span id="updTxt"></span><div class="ub"><div id="updFill"></div></div></div>
<script src="audio.js?v=2.29"></script>
<script>
{
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];

/* ---------- Einstellungen ---------- */
const DEF={ai:3,civ:0,map:1,foes:0,diff:0,age:0,gfx:1,music:60,sfx:80,vib:1,mute:0,fps:0};
let S={...DEF};
try{Object.assign(S,JSON.parse(localStorage.getItem('ee_settings')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('ee_settings',JSON.stringify(S))}catch(e){}};

/* ---------- Ton: Musik und Geräusche kommen aus audio.js ---------- */
let audioOn=false;
function initAudio(){ if(!window.EEAudio) return; EEAudio.init(); audioOn=true; applyVol(); }
function applyVol(){ if(window.EEAudio) EEAudio.setVol(S.music/100, S.sfx/100, S.mute); }
function click(){ if(audioOn) EEAudio.sfx('click'); }
function fanfare(){ if(audioOn) EEAudio.sfx('fanfare'); }
const vib=ms=>{if(S.vib&&navigator.vibrate)try{navigator.vibrate(ms)}catch(e){}};

/* ---------- Ladebildschirm ---------- */
const AGES=['Steinzeit','Bronzezeit','Mittelalter','Renaissance','Industriezeitalter','Moderne','Zukunft'];
const TIPS=['Tipp: Mit zwei Fingern ziehen verschiebt die Kamera.',
  'Tipp: Kneifen mit zwei Fingern zoomt ins Schlachtfeld.',
  'Tipp: Lange drücken und ziehen wählt viele Einheiten aus.',
  'Tipp: Ritter schlagen Infanterie, Speerträger stoppen Reiter.',
  'Tipp: Baue Häuser, damit dein Volk wachsen kann.',
  'Tipp: Ein Wunder, das 5 Minuten steht, gewinnt das Spiel.'];
const fill=$('#fill'),btxt=$('#btxt'),tip=$('#tip');
let ti=Math.floor(Math.random()*TIPS.length);
tip.textContent=TIPS[ti];
const tipTimer=setInterval(()=>{ti=(ti+1)%TIPS.length;tip.textContent=TIPS[ti]},2600);

// echte Ladeschritte: Menübild + Schrift, dazu Aufbau-Schritte
const loadImg=src=>new Promise(r=>{const i=new Image();i.onload=i.onerror=r;i.src=src});
let real=0;
Promise.all([loadImg('menue.jpg?v=2'),loadImg('laden.jpg?v=2'),(document.fonts?document.fonts.ready:Promise.resolve())]).then(()=>real=1);
let p=0;
const tick=setInterval(()=>{
  const cap=real?100:85;
  p=Math.min(cap,p+(real?2.2:Math.random()*1.6));
  fill.style.width=p+'%';
  const age=AGES[Math.min(6,Math.floor(p/100*7))];
  btxt.textContent=age+' … '+Math.floor(p)+' %';
  if(p>=100){clearInterval(tick);ready()}
},60);

// Erster Tipp irgendwo im Ladebildschirm startet die Musik (Browser erlauben Ton erst nach einem Tipp)
$('#load').addEventListener('pointerdown',()=>{ if(!audioOn){ initAudio(); EEAudio.play('theme'); $('#soundHint').style.display='none'; } });
// Automatisch Vollbild beim ersten Tipp im Ladebildschirm (Browser erlauben Vollbild nur nach einem Tipp)
function goFull(){ const d=document.documentElement, rq=d.requestFullscreen||d.webkitRequestFullscreen;
  if(document.fullscreenElement||document.webkitFullscreenElement||!rq) return;
  try{ const p=rq.call(d,{navigationUI:'hide'}); if(p&&p.then) p.then(()=>{ try{ screen.orientation.lock('landscape').catch(()=>{}); }catch(e){} }).catch(()=>{}); }catch(e){} }
$('#load').addEventListener('pointerup',goFull);
$('#load').addEventListener('click',goFull);
function ready(){
  clearInterval(tipTimer);
  if(audioOn){ setTimeout(enter, 600); return; }
  $('#stage').classList.add('tap');
  btxt.textContent='Tippe zum Starten';
  tip.textContent='Für das beste Erlebnis: Handy quer halten';
  $('#load').addEventListener('pointerup',enter,{once:true});
}
function enter(){
  if(!audioOn){ initAudio(); EEAudio.play('theme'); }
  vib(30);
  $('#load').classList.add('hidden');$('#menu').classList.remove('hidden');EE.showMenu(false);
}

/* ---------- Menü ---------- */
const open=id=>{click();$('#'+id).classList.remove('hidden')};
const closeAll=()=>{click();$$('.dlg').forEach(d=>d.classList.add('hidden'))};
$$('[data-open]').forEach(b=>b.addEventListener('click',()=>open(b.dataset.open)));
$$('[data-close]').forEach(b=>b.addEventListener('click',closeAll));
$$('.dlg').forEach(d=>d.addEventListener('click',e=>{if(e.target===d)closeAll()}));

let tt;
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.remove('hidden');clearTimeout(tt);tt=setTimeout(()=>t.classList.add('hidden'),2400)}

// Auswahl-Knöpfe
$$('.seg').forEach(seg=>{
  const k=seg.dataset.k,bs=[...seg.children];
  const draw=()=>bs.forEach((b,i)=>b.classList.toggle('on',i===S[k]));
  bs.forEach((b,i)=>b.addEventListener('click',()=>{S[k]=i;save();draw();click();vib(10)}));
  draw();
});
$$('input[type=range]').forEach(r=>{
  const k=r.dataset.k;r.value=S[k];
  r.addEventListener('input',()=>{S[k]=+r.value;save();applyVol()});
  r.addEventListener('change',click);
});

// Zivilisationen (Wappen-Banner)
const B=(bg,sym)=>'<defs><clipPath id="cp"><path d="M0 0H30V34L15 27L0 34Z"/></clipPath></defs><g clip-path="url(#cp)">'+bg+sym+'</g><path d="M0 0H30V34L15 27L0 34Z" fill="none" stroke="#f5d27a" stroke-width="1.4"/>';
const R=c=>'<rect width="30" height="36" fill="'+c+'"/>';
const sun=(cx,cy,r,c)=>{let o='<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+c+'"/>';for(let i=0;i<12;i++){const a=i*Math.PI/6;o+='<line x1="'+(cx+Math.cos(a)*(r+1))+'" y1="'+(cy+Math.sin(a)*(r+1))+'" x2="'+(cx+Math.cos(a)*(r+3.5))+'" y2="'+(cy+Math.sin(a)*(r+3.5))+'" stroke="'+c+'" stroke-width="1.2"/>'}return o};
// Länder: immer der heutige Name und die heutige Flagge. Aussehen und Einheiten kommen je Epoche von der damaligen Zivilisation (Stil-Zeile).
// [Name, Bonus, Flagge, Artikel (f/m/p oder leer), Stil je Epoche, altes Vorfahren-Banner (für frühe Epochen)]
const H=(...c)=>{const h=31/c.length;return c.map((f,i)=>'<rect y="'+(i*h).toFixed(2)+'" width="30" height="'+(i===c.length-1?36:h+.3).toFixed(2)+'" fill="'+f+'"/>').join('')};
const V=(...c)=>{const w=30/c.length;return c.map((f,i)=>'<rect x="'+(i*w).toFixed(2)+'" width="'+(w+.3).toFixed(2)+'" height="36" fill="'+f+'"/>').join('')};
const star=(cx,cy,r,f)=>{let d='';for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,q=i%2?r*.42:r;d+=(i?'L':'M')+(cx+Math.cos(a)*q).toFixed(2)+' '+(cy+Math.sin(a)*q).toFixed(2)}return '<path d="'+d+'Z" fill="'+f+'"/>'};
const UJ=(w,h)=>'<svg width="'+w+'" height="'+h+'" viewBox="0 0 30 18" preserveAspectRatio="none"><rect width="30" height="18" fill="#012169"/><path d="M0 0L30 18M30 0L0 18" stroke="#fff" stroke-width="4"/><path d="M0 0L30 18M30 0L0 18" stroke="#c8102e" stroke-width="1.5"/><path d="M15 0V18M0 9H30" stroke="#fff" stroke-width="6"/><path d="M15 0V18M0 9H30" stroke="#c8102e" stroke-width="3.5"/></svg>';
const CIVS=[
 ['Türkei','Kanonen und Belagerung +20 %, Janitscharen als Elite-Infanterie',B(R('#e30a17'),'<circle cx="12.5" cy="13" r="6" fill="#fff"/><circle cx="14" cy="13" r="4.8" fill="#e30a17"/>'+star(20,13,3,'#fff')),'f','Steinzeit: Anatolische Stämme · später Osmanisches Reich'],
 ['Italien','Legionäre +15 % Angriff, Einheiten auf Straßen schneller',B(V('#009246','#fff','#ce2b37'),''),'','Steinzeit: Italische Stämme · später Römisches Reich'],
 ['Griechenland','Phalanx (Speerträger) stärker, Forschung schneller',B(H('#0d5eaf','#fff','#0d5eaf','#fff','#0d5eaf','#fff','#0d5eaf','#fff','#0d5eaf'),'<rect width="13.8" height="17.2" fill="#0d5eaf"/><path d="M6.9 0V17.2M0 8.6H13.8" stroke="#fff" stroke-width="3.4"/>'),'','Steinzeit: Ägäische Stämme · später Antikes Griechenland'],
 ['Ägypten','Wunder und Tempel bauen schneller, Streitwagen stärker',B(H('#ce1126','#fff','#000'),'<path d="M15 10.6l1.6 1.2v3.6l-1.6 1-1.6-1v-3.6z" fill="#c09300"/>'),'','Steinzeit: Niltal-Stämme · später Reich der Pharaonen'],
 ['Irak','Universität und Forschung günstiger',B(H('#ce1126','#fff','#000'),'<path d="M8.5 15.5h13M10 13.2v2.3M13.5 12.5v3M17 13.2v2.3M20 12.8v2.7" stroke="#007a3d" stroke-width="1.3" fill="none"/>'),'m','Steinzeit: Stämme Mesopotamiens · später Babylonier'],
 ['Deutschland','Gebäude stabiler, Krieger mit mehr Leben',B(H('#000','#dd0000','#ffce00'),''),'','Steinzeit: Mitteleuropäische Stämme · später Germanen'],
 ['Großbritannien','Langbogenschützen mit mehr Reichweite, starke Flotte',B(R('#012169')+'<path d="M0 0L30 34M30 0L0 34" stroke="#fff" stroke-width="5"/><path d="M0 0L30 34M30 0L0 34" stroke="#c8102e" stroke-width="1.8"/><path d="M15 0V36M0 14H30" stroke="#fff" stroke-width="8"/><path d="M15 0V36M0 14H30" stroke="#c8102e" stroke-width="4.6"/>',''),'','Steinzeit: Britische Stämme · später Briten und Engländer'],
 ['Frankreich','Ritter und Reiter schneller',B(V('#0055a4','#fff','#ef4135'),''),'','Steinzeit: Gallische Stämme · später Franken'],
 ['Norwegen','Schiffe schneller, Plünderer bringen Beute',B(R('#ba0c2f')+'<path d="M10.5 0V36M0 14H30" stroke="#fff" stroke-width="7"/><path d="M10.5 0V36M0 14H30" stroke="#00205b" stroke-width="3.6"/>',''),'','Steinzeit: Nordische Jäger · später Wikinger'],
 ['Mongolei','Reiterbogenschützen, sehr schnelle Kavallerie',B(V('#c4272f','#015197','#c4272f'),'<circle cx="5" cy="9" r="1.6" fill="#f9cf02"/><rect x="3" y="11.5" width="4" height="1.4" fill="#f9cf02"/><rect x="3.6" y="13.6" width="2.8" height="5" fill="#f9cf02"/><rect x="3" y="19.2" width="4" height="1.4" fill="#f9cf02"/>'),'f','Steinzeit: Steppenvölker · später Mongolenreich'],

// Dateien der neuen Version vorab laden (danach kommen sie beim Neustart sofort aus dem Speicher)
async function prefetch(v){
  const files=['index.html?update='+v,'game.js?v='+v,'audio.js?v='+v,'three.min.js?v='+v,'online.js?v='+v,'silescrow.js?v='+v,'version.txt'];
  let done=0;
  for(const f of files){
    try{ const r=await fetch(f,{cache:'reload'}); const tot=+r.headers.get('content-length')||0;
      if(r.body && tot){ const rd=r.body.getReader(); let got=0; for(;;){ const {done:d,value}=await rd.read(); if(d) break; got+=value.length; updShow('Update V'+v+' wird geladen …', (done+Math.min(1,got/tot))/files.length); } }
      else await r.arrayBuffer();
    }catch(e){}
    done++; updShow('Update V'+v+' wird geladen …', done/files.length);
  }
}
async function startUpdate(force){
  if(updating || !updVer) return; updating=true;
  if(!inGame()) lockPlay(true);
  await prefetch(updVer);
  updState='ready';
  if(inGame() && !force){ updShow('Update V'+updVer+' bereit – startet beim Öffnen des Menüs', 1); setTimeout(()=>{ if(inGame()) $('#updBar').classList.add('mini'); }, 6000); return; }
  installUpdate();
}
function installUpdate(){ try{ if(window.EEGame && EEGame.running()) EEGame.save(); }catch(e){} updShow('Update V'+updVer+' – Neustart …', 1); setTimeout(()=>location.replace(location.pathname+'?update='+updVer),700); }
function checkUpdate(){
  if(location.protocol==='file:' || updating) return;
  fetch('version.txt?t='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.text():'').then(t=>{ t=t.trim();
    if(!(t && /^[0-9.]+$/.test(t) && newer(t,CUR_VER))) return;
    updVer=t;
    if(triedUpd===t){ updShow('Update V'+t+' – tippen zum Laden', 0); $('#updBar').classList.add('tap'); return; }   // GitHub war noch nicht fertig
    startUpdate(false);
  }).catch(()=>{});
}
$('#updBar').addEventListener('click',()=>{ if(!updVer) return; click(); if(updState==='ready') installUpdate(); else { updating=false; startUpdate(true); } });
checkUpdate(); setInterval(checkUpdate, 120000); document.addEventListener('visibilitychange',()=>{ if(!document.hidden) checkUpdate(); });

$('#bStart').addEventListener('click',()=>{if((S.epoch|0)>0){ toast('Diese Epoche kommt bald – starte in der Steinzeit'); vib(20); return; }fanfare();vib(40);closeAll();
  if(window.EEGame)window.EEGame.start();else toast('Spiel wird noch geladen …')});
window.EE={civBy,eraName,stoneSym:c=>STONE_SYM[c[0]]||'',VER:'2.29',S,CIVS,click,vib,toast,save,fanfare,applyVol,sfx:(n,v)=>{ if(audioOn) EEAudio.sfx(n,v); },music:m=>{ if(audioOn) EEAudio.play(m); },ambient:o=>{ if(audioOn) EEAudio.ambient(o); },showMenu:(running)=>{if(updState==='ready'){ setTimeout(installUpdate,50); }let has=running; try{ has=has||!!localStorage.getItem('ee_save_v1'); }catch(e){} $('#menu').classList.remove('hidden'); $('#bResume').classList.toggle('hidden',!has); $('[data-open=dPlay]').textContent=has?'Neu starten':'Spielen'; $('[data-open=dPlay]').classList.toggle('main',!has);},hideMenu:()=>{$('#menu').classList.add('hidden')}};
$('#bQuit').addEventListener('click',()=>{click();
  try{ if(window.EEGame) EEGame.save(); }catch(e){}
  try{ if(document.fullscreenElement) document.exitFullscreen(); }catch(e){}
  try{ window.close(); }catch(e){}
  setTimeout(()=>toast('Spiel gespeichert – du kannst den Browser jetzt schließen'),300);});
$('#bResume').addEventListener('click',()=>{click(); if(!window.EEGame) return; if(EEGame.running()) EEGame.resume(); else EEGame.load();});

// Ton & Vollbild
const drawMute=()=>$('#wave').style.opacity=S.mute?.15:1;drawMute();
$('#bSound').addEventListener('click',()=>{S.mute=S.mute?0:1;save();initAudio();applyVol();drawMute();click()});
$('#bFull').addEventListener('click',async()=>{
  click();
  try{
    if(!document.fullscreenElement){await document.documentElement.requestFullscreen();
      try{await screen.orientation.lock('landscape')}catch(e){}}
    else await document.exitFullscreen();
  }catch(e){toast('Vollbild wird hier nicht unterstützt')}
});

// Browser-Zoom per Geste verhindern
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('dblclick',e=>e.preventDefault());
}
